<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>後半へ進む</title>
<style>
  body { font-family: sans-serif; font-size: 17px; line-height: 1.7; margin: 0; padding: 20px;
         color: #202124; background: #fff; }
  .box { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 12px; }
  input { font-size: 18px; padding: 10px; width: 100%; box-sizing: border-box; border: 1px solid #999;
          border-radius: 6px; }
  button, .btn { display: inline-block; margin-top: 12px; font-size: 18px; padding: 12px 20px;
                 border-radius: 6px; border: 0; background: #1a73e8; color: #fff; text-decoration: none;
                 cursor: pointer; }
  button:disabled { background: #9aa0a6; }
  #msg { margin-top: 14px; }
  .small { font-size: 14px; color: #5f6368; }
</style></head>
<body><div class="box">
  <h1>後半へ進む</h1>
  <p>前半で入力したものと同じ<b>ワーカーID</b>を入力し、「後半へ進む」を押してください。</p>
  <input id="wid" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="ワーカーID">
  <button id="go" type="button">後半へ進む</button>
  <p id="msg" role="status"></p>
  <div id="next" hidden>
    <a id="link" class="btn">後半のアンケートを開く</a>
    <p class="small">後半のアンケートには、ワーカーIDが入力された状態で表示されます。</p>
  </div>
</div>
<script>
  const API = "https://script.google.com/macros/s/AKfycbyTZb9FCKmhhsTrEfpDRGuEjOCgFInaWmOOCZZtLTBXkVrBvfESx5FNVQXGOV6zz6kYcg/exec";
  const $ = (id) => document.getElementById(id);
  const fail = (text) => { $('msg').textContent = text; $('go').disabled = false; };
  async function go() {
    const wid = $('wid').value.trim();
    if (!wid) return fail('ワーカーIDを入力してください。');
    $('go').disabled = true;
    $('next').hidden = true;
    $('msg').textContent = '確認しています…（数秒かかります）';
    try {
      const q = new URLSearchParams({ api: '1', wid: wid, t: String(Date.now()) });
      const res = await fetch(API + '?' + q, { credentials: 'omit', cache: 'no-store' });
      const r = await res.json();
      if (!r.ok) return fail(r.msg);
      $('msg').textContent = r.again ? '前回と同じ後半のアンケートへご案内します。' : '確認できました。';
      $('link').href = r.url;
      $('next').hidden = false;
    } catch (e) {
      fail('通信できませんでした。少し待ってから、もう一度お試しください。');
    }
  }
  $('go').onclick = go;
  $('wid').addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
</script>
</body></html>
